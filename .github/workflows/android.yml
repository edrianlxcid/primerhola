name: Compilar APK Android

on:
  push:
    paths:
      - "GaleriaSwipe/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GaleriaSwipe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GaleriaSwipe.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GaleriaSwipe-apk
          path: GaleriaSwipe/GaleriaSwipe.apk

      - name: Publicar APK en "Releases" (para descargarlo desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: galeria-swipe-ultima
          name: Galería Swipe (última versión)
          prerelease: true
          make_latest: false
          body: |
            APK compilado automáticamente desde la rama `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Descarga **GaleriaSwipe.apk** desde tu celular y ábrelo para instalarlo.
          files: GaleriaSwipe/GaleriaSwipe.apk
